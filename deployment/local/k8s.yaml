apiVersion: v1
kind: Namespace
metadata:
  name: admin-client
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: treetracker-admin-client
  namespace: admin-client
spec:
  replicas: 1
  selector:
    matchLabels: { app: treetracker-admin-client }
  template:
    metadata:
      labels: { app: treetracker-admin-client }
    spec:
      containers:
        - name: web
          image: treetracker-admin-client:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: treetracker-admin-client
  namespace: admin-client
spec:
  selector: { app: treetracker-admin-client }
  ports:
    - port: 80
      targetPort: 80
