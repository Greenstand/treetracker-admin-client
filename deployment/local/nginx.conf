# Static-only SPA server. All API routing (/api/admin, /images, …) is handled by
# Emissary/Ambassador at the gateway — nginx no longer reverse-proxies anything.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routing (/verify, /login, ...) falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
