# Serve the CRA static build and reverse-proxy API traffic to admin-api in-cluster,
# so the browser sees a single origin (no CORS). The admin-api Service DNS is resolved
# at startup (admin-api is deployed before admin-client in up.sh).
upstream admin_api {
    server treetracker-admin-api.admin-api.svc.cluster.local:80;
}
upstream images_api {
    server images-api.images-api.svc.cluster.local:80;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # proxy_pass WITHOUT a URI part ⇒ nginx forwards the original request URI verbatim
    # (/auth/login, /api/trees?limit=1, ...) — no path rewriting.
    location /auth/ {
        proxy_pass http://admin_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/ {
        proxy_pass http://admin_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # images-api resize/proxy (admin OptimizedImage calls /images/img/...). The trailing
    # slash on proxy_pass strips the /images/ prefix, matching the base Mapping's rewrite: /
    # (so /images/img/x → images-api /img/x).
    location /images/ {
        proxy_pass http://images_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA client-side routing (/verify, /login, ...) falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
